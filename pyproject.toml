# Not a package: only the dependency groups are used (Python 3.13, pip >= 25.1)
#   pip install --group site
[dependency-groups]
site = [
    "pelican~=4.0",
    "markdown~=3.1",
    # social_card fetches pages and reads image sizes
    "requests~=2.0",
    "beautifulsoup4~=4.0",
    "pillow>=10.4",
]
