name: Build website

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'

jobs:
  test:
    runs-on: ubuntu-latest
    name: Build with Pelican
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - run: pip install --group site
      - name: Build dev
        run: pelican -s pelicanconf.py
      - name: Build publish
        run: pelican -s pelicanconfpublish.py
