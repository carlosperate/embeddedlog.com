{% if SHARIFF|default(false) %}
    <div class="article-sharing">
        <span class="article-footer-label">Share this article</span>
        <div class="article-sharing-actions">
            <button class="article-copy-link" type="button" aria-label="Copy link" title="Copy link" hidden>
                <i class="fa fa-link" aria-hidden="true"></i>
                <span>Copy link</span>
            </button>
            <div class="shariff"
                {% if SHARIFF_BACKEND_URL %}
                data-backend-url="{{ SHARIFF_BACKEND_URL }}"
                {% endif %}
                {% if SHARIFF_BUTTON_STYLE %}
                data-button-style="{{ SHARIFF_BUTTON_STYLE }}"
                {% endif %}
                {% if SHARIFF_LANG %}
                data-lang="{{ SHARIFF_LANG }}"
                {% endif %}
                {% if SHARIFF_ORIENTATION|default('vertical') %}
                data-orientation="{{ SHARIFF_ORIENTATION }}"
                {% endif %}
                {% if SHARIFF_SERVICES %}
                data-services='{{ SHARIFF_SERVICES|tojson }}'
                {% endif %}
                {% if SHARIFF_THEME %}
                data-theme="{{ SHARIFF_THEME }}"
                {% endif %}
                {% if SHARIFF_TWITTER_VIA|default(false) %}
                data-twitter-via="{{ TWITTER_USERNAME }}"
                {% endif %}
            ></div>
        </div>
        <span class="article-copy-status sr-only" role="status"></span>
    </div>
{% endif %}
